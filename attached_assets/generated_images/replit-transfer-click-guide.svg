<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2700" viewBox="0 0 1600 2700">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182D"/><stop offset="1" stop-color="#15415A"/></linearGradient>
 <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#61E8D7"/><stop offset="1" stop-color="#79A8FF"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#00101D" flood-opacity=".35"/></filter>
 <style>
 .title{font:800 59px Arial,sans-serif;fill:#F8FCFF}.sub{font:400 26px Arial,sans-serif;fill:#BBD4E8}
 .cardtitle{font:800 32px Arial,sans-serif;fill:#09213A}.body{font:400 24px Arial,sans-serif;fill:#38546A}
 .tiny{font:700 18px Arial,sans-serif;fill:#658095;letter-spacing:1px}.ui{font:600 20px Arial,sans-serif;fill:#D8E7F3}.uitext{font:500 19px Arial,sans-serif;fill:#39546A}
 .call{font:800 22px Arial,sans-serif;fill:#A1332D}.foot{font:700 25px Arial,sans-serif;fill:#E7FBFF}
 </style>
</defs>
<rect width="1600" height="2700" fill="url(#bg)"/>
<circle cx="1450" cy="180" r="250" fill="#61E8D7" opacity=".08"/><circle cx="100" cy="2460" r="300" fill="#79A8FF" opacity=".08"/>
<text x="100" y="112" class="tiny" fill="#61E8D7">CLICK-BY-CLICK VISUAL GUIDE</text>
<text x="100" y="190" class="title">Move your Replit site</text>
<text x="100" y="258" class="title">to another account</text>
<text x="100" y="315" class="sub">Follow the mouse pointer and red click circles in order.</text>

<!-- STEP 1 -->
<g filter="url(#shadow)"><rect x="90" y="380" width="1420" height="335" rx="28" fill="#F6FBFF"/>
<circle cx="170" cy="470" r="48" fill="url(#aqua)"/><text x="170" y="481" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#09213A">1</text>
<text x="250" y="460" class="cardtitle">Open your site project</text><text x="250" y="505" class="body">Open the Replit project that contains your website.</text>
<!-- browser UI --> <rect x="250" y="550" width="1210" height="115" rx="12" fill="#102C47"/>
<circle cx="283" cy="585" r="8" fill="#EF6B67"/><circle cx="310" cy="585" r="8" fill="#FFCA65"/><circle cx="337" cy="585" r="8" fill="#62D8A5"/>
<text x="380" y="592" class="ui">Your site project</text><rect x="1135" y="562" width="260" height="58" rx="11" fill="#1C4662"/>
<text x="1265" y="598" text-anchor="middle" class="ui">Project is open</text>
<!-- cursor --> <path d="M1125 610 l0 52 17-16 12 31 13-6-13-31 24 0z" fill="#FFFFFF" stroke="#0A2035" stroke-width="5"/><circle cx="1128" cy="620" r="35" fill="none" stroke="#FF625B" stroke-width="5"/><text x="1070" y="690" class="call">Mouse is here</text>
</g>

<!-- STEP 2 -->
<g filter="url(#shadow)"><rect x="90" y="755" width="1420" height="390" rx="28" fill="#F6FBFF"/>
<circle cx="170" cy="845" r="48" fill="url(#aqua)"/><text x="170" y="856" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#09213A">2</text>
<text x="250" y="835" class="cardtitle">Click Share</text><text x="250" y="880" class="body">Look at the top-right corner of the Replit screen.</text>
<rect x="250" y="930" width="1210" height="160" rx="12" fill="#102C47"/>
<text x="305" y="975" class="ui">Workspace</text><text x="520" y="975" class="ui">Editor</text><text x="700" y="975" class="ui">Console</text>
<rect x="1180" y="945" width="205" height="66" rx="12" fill="#E8F5F8"/><text x="1282" y="987" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#173B59">Share</text>
<path d="M1350 1018 l0 52 17-16 12 31 13-6-13-31 24 0z" fill="#FFFFFF" stroke="#0A2035" stroke-width="5"/><circle cx="1355" cy="1018" r="43" fill="none" stroke="#FF625B" stroke-width="6"/><text x="1165" y="1070" class="call">Click here</text>
</g>

<!-- STEP 3 -->
<g filter="url(#shadow)"><rect x="90" y="1190" width="1420" height="430" rx="28" fill="#F6FBFF"/>
<circle cx="170" cy="1280" r="48" fill="url(#aqua)"/><text x="170" y="1291" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#09213A">3</text>
<text x="250" y="1270" class="cardtitle">Invite the other account</text><text x="250" y="1315" class="body">Type the recipient’s Replit username or email address.</text>
<!-- dialog --> <rect x="390" y="1360" width="900" height="205" rx="16" fill="#FFFFFF" stroke="#BCD0DF" stroke-width="3"/>
<text x="445" y="1405" font-family="Arial" font-size="25" font-weight="800" fill="#173B59">Share this project</text><text x="445" y="1440" class="uitext">Invite a collaborator</text>
<rect x="445" y="1460" width="520" height="58" rx="9" fill="#F1F5F8" stroke="#AFC4D3" stroke-width="2"/><text x="470" y="1497" class="uitext">username or email</text>
<rect x="1010" y="1460" width="200" height="58" rx="10" fill="#2D7B8E"/><text x="1110" y="1497" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">Invite</text>
<path d="M1030 1500 l0 48 16-15 11 28 12-5-12-28 22 0z" fill="#FFFFFF" stroke="#0A2035" stroke-width="5"/><circle cx="1035" cy="1498" r="38" fill="none" stroke="#FF625B" stroke-width="6"/><text x="965" y="1588" class="call">Click Invite</text>
</g>

<!-- STEP 4 -->
<g filter="url(#shadow)"><rect x="90" y="1665" width="1420" height="420" rx="28" fill="#F6FBFF"/>
<circle cx="170" cy="1755" r="48" fill="url(#aqua)"/><text x="170" y="1766" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#09213A">4</text>
<text x="250" y="1745" class="cardtitle">Recipient: open and copy the project</text><text x="250" y="1790" class="body">The recipient accepts the invitation, then clicks Fork or Remix.</text>
<rect x="390" y="1835" width="900" height="190" rx="16" fill="#102C47"/><text x="450" y="1880" class="ui">Shared project</text>
<rect x="845" y="1855" width="175" height="62" rx="10" fill="#E8F5F8"/><text x="932" y="1894" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#173B59">Open</text>
<rect x="1040" y="1855" width="190" height="62" rx="10" fill="#2D7B8E"/><text x="1135" y="1894" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#FFFFFF">Fork / Remix</text>
<path d="M1100 1930 l0 50 16-15 11 29 12-5-12-29 22 0z" fill="#FFFFFF" stroke="#0A2035" stroke-width="5"/><circle cx="1105" cy="1930" r="40" fill="none" stroke="#FF625B" stroke-width="6"/><text x="1020" y="2000" class="call">Click to make a copy</text>
</g>

<!-- STEP 5 -->
<g filter="url(#shadow)"><rect x="90" y="2130" width="1420" height="355" rx="28" fill="#FFF7E9"/>
<circle cx="170" cy="2220" r="48" fill="#FFBE5C"/><text x="170" y="2231" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#09213A">5</text>
<text x="250" y="2210" class="cardtitle">Add secrets again in the new copy</text><text x="250" y="2255" class="body">Click Tools, then Secrets. Add the required values privately.</text>
<rect x="400" y="2310" width="330" height="100" rx="12" fill="#102C47"/><text x="455" y="2352" class="ui">Tools</text><text x="455" y="2385" class="ui">Secrets</text><path d="M645 2338 l0 50 16-15 11 29 12-5-12-29 22 0z" fill="#FFFFFF" stroke="#0A2035" stroke-width="5"/><circle cx="650" cy="2340" r="40" fill="none" stroke="#FF625B" stroke-width="6"/><text x="760" y="2375" class="call">Click Secrets</text>
<rect x="880" y="2310" width="450" height="100" rx="12" fill="#FFF0D2" stroke="#F2C36A" stroke-width="2"/><text x="1105" y="2352" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#855100">Re-add your site secrets</text><text x="1105" y="2385" text-anchor="middle" font-family="Arial" font-size="19" fill="#9A6A29">Do not paste passwords in chat</text>
</g>

<!-- STEP 6 -->
<g filter="url(#shadow)"><rect x="90" y="2530" width="1420" height="125" rx="28" fill="#0E2A44" stroke="#61E8D7" stroke-width="2"/>
<circle cx="170" cy="2592" r="40" fill="url(#aqua)"/><text x="170" y="2602" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#09213A">6</text>
<text x="250" y="2582" class="foot">Click Deploy or Publish in the new copy.</text><text x="250" y="2618" class="sub" font-size="21">Review settings, then publish it under the recipient’s account.</text>
<rect x="1220" y="2560" width="190" height="58" rx="29" fill="#2D7B8E"/><text x="1315" y="2597" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#FFFFFF">Publish</text>
</g>
</svg>