<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A33"/>
      <stop offset="1" stop-color="#123A59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63E6D8"/>
      <stop offset="1" stop-color="#76A9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#03101f" flood-opacity=".32"/>
    </filter>
    <style>
      .title { font: 800 62px Arial, Helvetica, sans-serif; fill: #F7FBFF; }
      .subtitle { font: 400 27px Arial, Helvetica, sans-serif; fill: #BBD2E8; }
      .stepTitle { font: 800 31px Arial, Helvetica, sans-serif; fill: #09213A; }
      .body { font: 400 25px Arial, Helvetica, sans-serif; fill: #35526B; }
      .small { font: 700 21px Arial, Helvetica, sans-serif; fill: #617B91; letter-spacing: 1px; }
      .badge { font: 800 28px Arial, Helvetica, sans-serif; fill: #09213A; }
      .footer { font: 700 26px Arial, Helvetica, sans-serif; fill: #E7FAFF; }
      .muted { font: 400 22px Arial, Helvetica, sans-serif; fill: #BBD2E8; }
    </style>
  </defs>

  <rect width="1600" height="2200" fill="url(#bg)"/>
  <circle cx="1450" cy="140" r="220" fill="#63E6D8" opacity=".08"/>
  <circle cx="80" cy="1960" r="260" fill="#76A9FF" opacity=".08"/>

  <text x="110" y="140" class="small" fill="#63E6D8">REPLIT PROJECT GUIDE</text>
  <text x="110" y="225" class="title">How to move your site</text>
  <text x="110" y="295" class="title">to another Replit account</text>
  <text x="110" y="355" class="subtitle">Use Share → Fork/Remix. There is no direct account-to-account transfer.</text>

  <!-- connector -->
  <path d="M800 505 V1960" stroke="#63E6D8" stroke-width="8" stroke-dasharray="14 18" opacity=".65"/>

  <!-- step 1 -->
  <g filter="url(#shadow)">
    <rect x="130" y="450" width="1340" height="245" rx="28" fill="#F7FBFF"/>
    <circle cx="225" cy="572" r="63" fill="url(#accent)"/>
    <text x="225" y="584" text-anchor="middle" class="badge">1</text>
    <rect x="330" y="495" width="220" height="42" rx="21" fill="#E5F8F5"/>
    <text x="440" y="524" text-anchor="middle" class="small" fill="#187E78">YOUR ACCOUNT</text>
    <text x="330" y="588" class="stepTitle">Open the project</text>
    <text x="330" y="635" class="body">Open the Replit project that contains your website.</text>
    <rect x="1045" y="522" width="300" height="72" rx="14" fill="#102C47"/>
    <text x="1195" y="567" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#F7FBFF">Your site project</text>
    <text x="1195" y="605" text-anchor="middle" font-family="Arial" font-size="20" fill="#9FBBD1">Open the correct Repl</text>
  </g>

  <!-- step 2 -->
  <g filter="url(#shadow)">
    <rect x="130" y="755" width="1340" height="245" rx="28" fill="#F7FBFF"/>
    <circle cx="225" cy="877" r="63" fill="url(#accent)"/>
    <text x="225" y="889" text-anchor="middle" class="badge">2</text>
    <rect x="330" y="800" width="145" height="42" rx="21" fill="#E5F8F5"/>
    <text x="402" y="829" text-anchor="middle" class="small" fill="#187E78">SHARE</text>
    <text x="330" y="893" class="stepTitle">Invite the other account</text>
    <text x="330" y="940" class="body">Click Share, then invite the recipient by username or email.</text>
    <rect x="1035" y="830" width="320" height="78" rx="14" fill="#EAF0F6" stroke="#C5D5E3" stroke-width="2"/>
    <text x="1070" y="878" font-family="Arial" font-size="24" font-weight="700" fill="#173B59">Share</text>
    <path d="M1260 868 h58 M1292 840 l28 28 -28 28" fill="none" stroke="#2D7B8E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- step 3 -->
  <g filter="url(#shadow)">
    <rect x="130" y="1060" width="1340" height="270" rx="28" fill="#F7FBFF"/>
    <circle cx="225" cy="1195" r="63" fill="url(#accent)"/>
    <text x="225" y="1207" text-anchor="middle" class="badge">3</text>
    <rect x="330" y="1105" width="170" height="42" rx="21" fill="#E5F8F5"/>
    <text x="415" y="1134" text-anchor="middle" class="small" fill="#187E78">RECIPIENT</text>
    <text x="330" y="1198" class="stepTitle">Open the invitation</text>
    <text x="330" y="1245" class="body">The recipient accepts access and opens the shared project.</text>
    <text x="330" y="1285" class="body">They should then choose Fork or Remix to make their own copy.</text>
    <rect x="1030" y="1132" width="340" height="112" rx="16" fill="#102C47"/>
    <text x="1200" y="1180" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#F7FBFF">Fork / Remix</text>
    <text x="1200" y="1218" text-anchor="middle" font-family="Arial" font-size="20" fill="#9FBBD1">Create their own copy</text>
  </g>

  <!-- step 4 warning -->
  <g filter="url(#shadow)">
    <rect x="130" y="1390" width="1340" height="315" rx="28" fill="#FFF8EC"/>
    <circle cx="225" cy="1547" r="63" fill="#FFBE5C"/>
    <text x="225" y="1559" text-anchor="middle" class="badge">4</text>
    <rect x="330" y="1435" width="270" height="42" rx="21" fill="#FFE7B5"/>
    <text x="465" y="1464" text-anchor="middle" class="small" fill="#9A5D00">NEW COPY</text>
    <text x="330" y="1528" class="stepTitle">Set up secrets again</text>
    <text x="330" y="1575" class="body">Secrets and environment variables do not transfer.</text>
    <text x="330" y="1615" class="body">In the new project, open Tools → Secrets and add them again.</text>
    <rect x="1030" y="1480" width="340" height="132" rx="16" fill="#FFF0D2" stroke="#F2C36A" stroke-width="2"/>
    <text x="1200" y="1525" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#855100">Secrets</text>
    <text x="1200" y="1560" text-anchor="middle" font-family="Arial" font-size="20" fill="#9A6A29">Re-add privately</text>
    <text x="1200" y="1592" text-anchor="middle" font-family="Arial" font-size="18" fill="#9A6A29">Never paste passwords in chat</text>
  </g>

  <!-- step 5 -->
  <g filter="url(#shadow)">
    <rect x="130" y="1765" width="1340" height="245" rx="28" fill="#F7FBFF"/>
    <circle cx="225" cy="1887" r="63" fill="url(#accent)"/>
    <text x="225" y="1899" text-anchor="middle" class="badge">5</text>
    <rect x="330" y="1810" width="240" height="42" rx="21" fill="#E5F8F5"/>
    <text x="450" y="1839" text-anchor="middle" class="small" fill="#187E78">PUBLISH AGAIN</text>
    <text x="330" y="1903" class="stepTitle">Reconnect and publish</text>
    <text x="330" y="1950" class="body">Reconfigure deployment settings, then publish the new copy.</text>
    <rect x="1080" y="1845" width="250" height="72" rx="36" fill="#2D7B8E"/>
    <text x="1205" y="1891" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF">Publish</text>
  </g>

  <rect x="130" y="2070" width="1340" height="78" rx="20" fill="#0E2A44" stroke="#63E6D8" stroke-width="2"/>
  <text x="800" y="2119" text-anchor="middle" class="footer">The original project stays with you; the recipient owns the fork.</text>
</svg>