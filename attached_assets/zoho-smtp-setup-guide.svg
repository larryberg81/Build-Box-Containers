<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
</defs>
<rect width="1400" height="1700" fill="url(#bg)"/>
<rect x="70" y="55" width="1260" height="150" rx="28" fill="#fff" filter="url(#shadow)"/>
<circle cx="145" cy="130" r="40" fill="#f4511e"/><path d="M125 130h40M145 110v40" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
<text x="215" y="118" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#111827">Connect Zoho Email to Built Box</text>
<text x="215" y="163" font-family="Arial,sans-serif" font-size="24" fill="#64748b">Create an app password, then save it securely in Replit</text>

<g filter="url(#shadow)"><rect x="70" y="250" width="1260" height="245" rx="28" fill="#fff"/></g>
<circle cx="140" cy="325" r="38" fill="#2563eb"/><text x="140" y="338" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">1</text>
<text x="205" y="320" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Sign in to Zoho Accounts</text>
<text x="205" y="365" font-family="Arial" font-size="24" fill="#475569">Go to accounts.zoho.com using the owner account for:</text>
<rect x="205" y="392" width="530" height="62" rx="12" fill="#fff7ed" stroke="#f4511e" stroke-width="2"/>
<text x="230" y="432" font-family="Arial" font-size="27" font-weight="700" fill="#c2410c">info@builtboxcontainer.com</text>

<g filter="url(#shadow)"><rect x="70" y="535" width="1260" height="285" rx="28" fill="#fff"/></g>
<circle cx="140" cy="610" r="38" fill="#2563eb"/><text x="140" y="623" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">2</text>
<text x="205" y="605" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Open Security</text>
<rect x="205" y="648" width="1030" height="105" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="245" y="692" font-family="Arial" font-size="26" fill="#334155">Zoho Accounts</text><text x="448" y="692" font-family="Arial" font-size="28" fill="#94a3b8">›</text>
<text x="485" y="692" font-family="Arial" font-size="26" font-weight="700" fill="#2563eb">Security</text><text x="610" y="692" font-family="Arial" font-size="28" fill="#94a3b8">›</text>
<text x="645" y="692" font-family="Arial" font-size="26" font-weight="700" fill="#2563eb">Application-Specific Passwords</text>
<text x="245" y="732" font-family="Arial" font-size="20" fill="#64748b">Enable multi-factor authentication first if Zoho asks you to.</text>

<g filter="url(#shadow)"><rect x="70" y="860" width="1260" height="280" rx="28" fill="#fff"/></g>
<circle cx="140" cy="935" r="38" fill="#2563eb"/><text x="140" y="948" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">3</text>
<text x="205" y="930" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Generate a password for the website</text>
<rect x="205" y="974" width="560" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="230" y="1000" font-family="Arial" font-size="18" fill="#64748b">Application name</text>
<text x="230" y="1030" font-family="Arial" font-size="25" font-weight="700" fill="#111827">Built Box Website</text>
<rect x="800" y="974" width="310" height="70" rx="12" fill="#f4511e"/>
<text x="955" y="1018" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#fff">GENERATE</text>
<text x="205" y="1090" font-family="Arial" font-size="22" fill="#475569">Copy the generated app password. Do not use your normal Zoho password.</text>

<g filter="url(#shadow)"><rect x="70" y="1180" width="1260" height="385" rx="28" fill="#fff"/></g>
<circle cx="140" cy="1255" r="38" fill="#16a34a"/><text x="140" y="1268" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#fff">4</text>
<text x="205" y="1250" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Enter both values in Replit’s secure form</text>
<rect x="205" y="1295" width="990" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="235" y="1325" font-family="Arial" font-size="18" fill="#64748b">SMTP_USER</text>
<text x="235" y="1360" font-family="Arial" font-size="27" font-weight="700" fill="#111827">info@builtboxcontainer.com</text>
<rect x="205" y="1405" width="990" height="88" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="235" y="1435" font-family="Arial" font-size="18" fill="#64748b">SMTP_PASS</text>
<text x="235" y="1470" font-family="Arial" font-size="27" font-weight="700" fill="#111827">Paste the Zoho application-specific password</text>
<rect x="1000" y="1510" width="195" height="42" rx="10" fill="#16a34a"/><text x="1098" y="1539" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">SAVE SECRETS</text>

<rect x="70" y="1605" width="1260" height="55" rx="16" fill="#1e293b" stroke="#334155"/>
<text x="700" y="1641" text-anchor="middle" font-family="Arial" font-size="22" fill="#e2e8f0">Never paste the app password into chat. Use only Replit’s secure secrets form.</text>
</svg>